<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="title">
<title id="title">Difference-in-differences: observed group means</title>
<defs>
<marker id="causal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#107895"/></marker>
<marker id="confounding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a2515"/></marker>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #26353c; }
.label { font-size: 27px; }
.small { font-size: 23px; fill: #66747c; }
.node-label { font-size: 42px; font-style: italic; }
.node { stroke-width: 3; fill: white; }
.node.treatment { stroke: #107895; fill: #eff7f9; }
.node.outcome { stroke: #26353c; }
.node.unobserved { stroke: #9a2515; stroke-dasharray: 8 5; fill: #fff8f5; }
.node-label.treatment, .teal { fill: #107895; }
.node-label.unobserved, .rust { fill: #9a2515; }
.edge { fill: none; stroke-width: 3.2; }
.causal { stroke: #107895; }
.confounding { stroke: #9a2515; }
.question { font-size: 37px; fill: #9a2515; }
</style>
</defs>
<path d="M 95 40 L 95 335 L 640 335" fill="none" stroke="#66747c" stroke-width="2"/>
<text x="95" y="22" class="small" text-anchor="start">Mean outcome</text>
<text x="170" y="375" class="label" text-anchor="middle">Before</text>
<text x="610" y="375" class="label" text-anchor="middle">After</text>
<path d="M 170 280 L 610 230" fill="none" stroke="#66747c" stroke-width="4"/>
<path d="M 170 180 L 610 55" fill="none" stroke="#107895" stroke-width="4"/>

<circle cx="170" cy="180" r="7" fill="#107895"/>
<circle cx="610" cy="55" r="7" fill="#107895"/>
<circle cx="170" cy="280" r="7" fill="#66747c"/>
<circle cx="610" cy="230" r="7" fill="#66747c"/>
<text x="145" y="171" class="label teal" text-anchor="end">60</text>
<text x="598" y="35" class="label teal" text-anchor="end">85</text>
<text x="145" y="305" class="label" text-anchor="end">40</text>
<text x="598" y="260" class="label" text-anchor="end">50</text>
<text x="675" y="49" class="label teal" text-anchor="start">Treated group</text>
<text x="675" y="239" class="label" text-anchor="start">Untreated group</text>

<text x="95" y="416" class="small" text-anchor="start">Hypothetical numbers; treatment begins between periods.</text>
</svg>
